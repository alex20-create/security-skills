name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fork-keeper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: git version
        run: git --version
      - name: unit tests
        run: python -I -m unittest discover -s fork-keeper-tests -t fork-keeper-tests -v
